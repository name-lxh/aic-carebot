# ============================================================================
#  智慧养老护理赛题 — 任务状态机参数
# ============================================================================

# --- 点位与日志 -----------------------------------------------------------
waypoints_file: ""        # 由 launch 注入 $(find carebot_eldercare)/config/waypoints.yaml
event_log: /tmp/carebot_eldercare/mission_events.jsonl

# --- 启动行为 -------------------------------------------------------------
autostart: false          # true = 节点起来 3 秒后自动开跑（调试用）
                          # false = 等待 /eldercare/start 信号（比赛用，裁判示意后触发）
dry_run: false            # true = 只跑状态机逻辑，不控实物（赛前彩排用）

# --- 超时与重试 -----------------------------------------------------------
goal_timeout: 45.0        # 单点导航超时（秒）
max_retries: 2            # 单步最大重试次数
qr_timeout: 20.0          # 二维码识别超时（秒）
face_max_rounds: 3        # 人脸核验最大轮数
settle_time: 1.0          # 到达点位后的稳定时间（秒）

# --- 安全护栏 -------------------------------------------------------------
# 赛题规定："1 分钟内未对项目情景做出回应" 即触发故障判定。
# 因此全局看门狗设为 55 秒：任一步骤卡住超过该时间，状态机会播报并走降级路径。
watchdog_sec: 55
