# ============================================================================
#  ⚠️ 本文件已废弃（DEPRECATED）
# ============================================================================
#  点位配置统一到：carebot_nav_kit/config/waypoints.yaml
#
#  eldercare_full.launch 现在指向 nav_kit 那一份。本文件保留仅为兼容
#  旧引用，内容不再维护。
#
#  为什么合并：两份点位文件是"改了一份忘了另一份"的温床 ——
#  标定明明做了，任务跑起来还是往占位坐标走，排查很费时间。
# ============================================================================
# ============================================================================
#  智慧养老护理赛题 — 导航点位配置
# ============================================================================
#  ⚠️ 本文件必须**现场标定**！
#
#  标定步骤：
#    1. 用 gmapping 建好家居场景地图，保存到 carebot_navigation/maps/
#    2. 启动导航：roslaunch carebot_navigation ld_navigation.launch
#    3. 在 RViz 里用 "2D Pose Estimate" 给机器人一个初始位姿
#    4. 在地图上把机器人**手动开到**每个点，用
#         rosrun tf tf_echo map base_footprint
#       读出 Translation (x, y) 与 Rotation 的 yaw（或用下面的一行命令）
#         python -c "import tf,rospy; ..."
#       把 x / y / yaw 填到下面
#    5. 重新启动导航，用 /eldercare/run_once 服务验证每个点都能到达
#
#  坐标系：map（与 map_server 加载的地图一致）
#  角度单位：弧度。常见值：0 = 朝 +X，1.5708 = 朝 +Y，3.1416 = 朝 -X
# ============================================================================

frames:
  map: map
  robot_base: base_footprint

# ---------------------------------------------------------------------------
# 点位定义
# ---------------------------------------------------------------------------
#  说明：赛题的二维码张贴位置与起点位置**现场随机**，所以：
#    · qr_area  —— 填"二维码张贴区域前方"的固定可达点（现场公布二维码位置后改）
#    · 起点     —— **不要写死**。mission_manager 会在任务开始时用 tf 记录实际起始位姿，
#                   结束时自动返回该位姿。下面的 start_default 只在 tf 读取失败时兜底。
# ---------------------------------------------------------------------------
waypoints:

  # 兜底起点：仅当任务开始时无法从 tf 读到位姿才会用到
  start_default: {x: 0.0,  y: 0.0,  yaw: 0.0}

  # 二维码张贴区域正前方的停留点
  qr_area:       {x: 1.5,  y: 0.0,  yaw: 0.0}

  # A 点：人脸核验点（离开客厅前）
  point_A:       {x: 1.0,  y: -0.8, yaw: 1.5708}

  # B 点：卧室（要开电灯 + 窗帘）
  room_B:        {x: 2.2,  y: 1.2,  yaw: 0.0}

  # C 点：厨房（要读烟雾 + 开风扇）
  room_C:        {x: 2.2,  y: -1.2, yaw: 0.0}

  # D 点：书房（要漏水检测 + 播报）
  room_D:        {x: 0.6,  y: 1.4,  yaw: 3.1416}

# ---------------------------------------------------------------------------
# 容差与超时
# ---------------------------------------------------------------------------
# 3m×3m 场地很小，单点导航正常应在 10 秒内完成。
# goal_timeout_sec 给到 45 秒已经非常宽松，目的是避免因偶发定位跳变而误判超时。
tolerances:
  xy_goal_tolerance: 0.08      # 与 carebot_navigation/param/dwa_local_planner_params.yaml 一致
  yaw_goal_tolerance: 0.10
  goal_timeout_sec: 45
  max_retries: 2
  settle_time: 1.0             # 到达后稳定时间（秒），让定位收敛再开始任务

# ---------------------------------------------------------------------------
# 恢复策略
# ---------------------------------------------------------------------------
recovery:
  max_full_restarts: 2         # 整轮任务最大重启次数（防止无限循环）
  stuck_detection_sec: 20      # 单点导航超过此时间仍未到达则视为卡住
  backup_on_stuck: true        # 卡住时先后退 0.3m 再重规划

