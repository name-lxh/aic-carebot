# ============================================================================
#  占位地图 —— 由 make_placeholder_map.py 生成
# ============================================================================
#  ⚠️⚠️ 这张地图是**空房间**，仅供导航栈自检使用，不能用于正式比赛导航！
#
#  它的作用：让 map_server 能正常加载，从而让 navigation.launch 完整启动，
#            便于在真正建图之前先验证 amcl / move_base / costmap 的配置是否正确。
#
#  生成参数：
#    场地     3.0 m × 3.0 m
#    分辨率   0.05 m/像素
#    图像     80 × 80 像素
