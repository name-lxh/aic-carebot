#    留白     0.5 m
#
#  替换方法（建好真实地图后）：
#    roslaunch carebot_nav_kit mapping.launch      # 建图
#    rosrun carebot_nav_kit save_map.sh -n mymap   # 保存，会覆盖本文件
# ============================================================================

image: mymap.pgm
resolution: 0.05
