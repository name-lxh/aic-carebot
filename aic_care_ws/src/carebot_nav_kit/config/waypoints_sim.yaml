# ============================================================================
#  仿真场地（sim_arena）的导航点位
# ============================================================================
#  ⚠️ 这是**仿真专用**点位，不要用在实车上。
#
#  实车的点位在 carebot_nav_kit/config/waypoints.yaml —— 那一份需要
#  现场标定（起点和二维码位置现场随机公布）。
#
#  本文件与 scripts/sim_arena.py 的 POINTS 一一对应：
#      sim_arena.POINTS  →  本文件 waypoints
#  改了任何一边都要同步改另一边。
#
#  ⚠️ 这些点位是 **scripts/auto_points.py 自动算出来的**，不是手工试的。
#     手工试了好几轮都失败，原因是靠眼睛看 ASCII 图估"离墙多远"很不准。
#     程序用距离变换算出每个可通行格到最近墙的距离，再在指定区域挑
#     "距离最大"的格 —— 一次就对。
#
#     **改布局后要重跑**：
#         python scripts/auto_points.py        # 打印建议点位
#         python scripts/sim_arena.py --write  # 重新生成地图
#
#  ⚠️ 每个点位都必须离墙 ≥ 0.45 m：
#        机器人半径 0.18 + 膨胀半径 0.22 = 0.40 m 是最低要求
#        低于这个值，膨胀层会把点位糊成高代价格，
#        规划器要么绕远要么直接报 NO PATH。
#
#  坐标系是**中心为原点**（不是地图左下角）——
#  因为 fake_sensors.py 的 FakeWorld 就是这么定的：
#      ox = -w*res/2,  oy = -h*res/2
#  53 格 @0.1m → map 的 origin 是 (-2.65, -2.65)，
#  世界坐标 x,y ∈ [-2.65, 2.65]。
#
#  角度：0 = 朝 +X，1.5708 = 朝 +Y（北），3.1416 = 朝 -X
# ============================================================================

frames:
  map: map
  robot_base: base_footprint

waypoints:

  # 起点：底部开口区（朝北）。实车上起点是**现场随机**的，
  # mission_manager 会在任务开始时用 tf 记录实际位姿，结束时回到那里。
  # 这个值只在仿真里用作固定起点。
  start_default: {x:  0.00, y: -1.90, yaw: 1.5708}

  # 二维码张贴区域正前方（客厅中部偏左）
  qr_area:       {x: -0.80, y: -0.80, yaw: 0.0000}

  # A 点：人脸核验点（离开客厅前）
  point_A:       {x:  0.20, y: -0.80, yaw: 0.0000}

  # B 点：卧室（左上，开电灯 + 窗帘）
  room_B:        {x: -1.90, y:  1.60, yaw: 0.0000}

  # C 点：厨房（中上，读烟雾 + 开风扇）
  room_C:        {x: -0.90, y:  1.60, yaw: 0.0000}

  # D 点：书房（右上，漏水检测 + 播报）
  room_D:        {x:  1.70, y:  1.80, yaw: 0.0000}

# ---------------------------------------------------------------------------
# 容差与超时
# ---------------------------------------------------------------------------
# ⚠️ 跟实车保持一致（xy 0.08 / yaw 0.10），**不刻意放松**。
#
#    仿真的定位是"接近完美"的（amcl 拿到无噪激光 + 真值里程计），
#    所以仿真通过率天生比实车高。如果这里再把容差放宽，
#    "仿真通过"就完全没有参考价值了 —— 掩盖真问题。
#
#    反过来，仿真里**过不了**的地方，实车一定过不了 —— 那才是有用信号。
tolerances:
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.10
  goal_timeout_sec: 45
  max_retries: 2
  settle_time: 1.0

recovery:
  max_full_restarts: 2
  stuck_detection_sec: 20
  backup_on_stuck: true
