# ============================================================================
#  航点配置 —— carebot_nav_kit
# ============================================================================
#  被 waypoint_nav.py 加载，提供按名字导航的能力。
#
#  两种填充方式：
#
#   方式 A（推荐）：用 capture_pose 服务现场标定
#       1. 启动导航并在 rviz 里给好初始位姿
#       2. 手动把机器人推到目标点（或用键盘遥控开过去）
#       3. 执行：
#            rosservice call /nav/capture_pose "qr_area"
#       4. 脚本会把当前位姿自动写入本文件
#
#   方式 B：从 rviz 读坐标手动填
#       1. rviz 里用 "Publish Point" 点目标位置，读终端输出的 x,y
#       2. 或用 rosrun tf tf_echo map base_footprint 读实时位姿
#       3. 填到下面的 waypoints 里
#
#  ⚠️ 坐标必须与所用的地图匹配。换一张地图，所有点位都要重新标定。
#     建议把地图名写进下面的注释，避免张冠李戴。
#
#  构图基准地图：mymap（占位，请改成实际地图名）
# ============================================================================

frame_id: map

# ---------------------------------------------------------------------------
#  赛题点位
# ---------------------------------------------------------------------------
#  赛题场地 3m×3m，房间分布见赛题规则图二：
#    客厅（含二维码区、A 点核验区、随机起点）/ 卧室 B / 厨房 C / 书房 D
#
#  下面是一组**占位值**，仅用于让配置能被正确解析和自检通过。
#  实际上车后必须全部重新标定！
# ---------------------------------------------------------------------------
waypoints:

  # --- 起点 ---------------------------------------------------------------
  # 赛题的起点位置是**随机的**，所以这里只是一个兜底值。
  # 正确做法是由任务状态机在开始时用 TF 记录实际位姿（见 carebot_eldercare）。
  start_default: {x: 0.0,  y: 0.0,  yaw: 0.0}

  # --- 客厅 ---------------------------------------------------------------
  # 二维码张贴区域正前方的停留点。
  # 二维码位置现场随机公布，标定时把它当作"能看到二维码的可达点"。
  qr_area:       {x: 1.5,  y: 0.0,  yaw: 0.0}

  # A 点：离开客厅前做人脸核验的位置。
  # 要求：能正对老人、光照合适（太暗人脸识别会失败）。
  point_A:       {x: 1.0,  y: -0.8, yaw: 1.5708}

  # --- 三个房间 -----------------------------------------------------------
  # B 点：卧室（开电灯 + 窗帘）
  room_B:        {x: 2.2,  y: 1.2,  yaw: 0.0}

  # C 点：厨房（读烟雾 + 开风扇）
  room_C:        {x: 2.2,  y: -1.2, yaw: 0.0}

  # D 点：书房（漏水检测）
  room_D:        {x: 0.6,  y: 1.4,  yaw: 3.1416}

  # --- 调试用点位 ---------------------------------------------------------
  # 建图时的辅助标记点，方便验证导航是否准确。
  # 正式比赛用不到，但调试阶段很有用。
  # debug_origin: {x: 0.0, y: 0.0, yaw: 0.0}
