# ============================================================================
#  robot_localization EKF 参数 —— 里程计与 IMU 融合
# ============================================================================
#  用途：把轮式里程计（/odom）与 IMU（/imu）融合成一条更可靠的里程计，
#        输出 /odometry/filtered，并发布 odom → base_footprint 的 TF。
#
#  为什么小场地特别需要它：
#    3m×3m 场地里机器人频繁启停转向，纯轮式里程计打滑会快速累积角度误差。
#    融合 IMU 的角速度后，amcl 收敛更快、地图不易扭曲。
#
#  ⚠️ 重要：world_frame 必须与 odom_frame 一致（本文件设为 odom）。
#     如果设成 map，EKF 会去发布 map → odom，与 amcl 抢同一个 TF，导致定位跳变。
# ============================================================================

# --- 坐标系 ---------------------------------------------------------------
map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom                 # ← 关键：与 odom_frame 相同，只发布 odom→base_footprint

# --- 频率 -----------------------------------------------------------------
frequency: 30.0                   # 滤波更新频率
sensor_timeout: 0.1
two_d_mode: true                  # 平面运动，忽略 z/roll/pitch（3m 平地场景）

# --- TF 输出 --------------------------------------------------------------
publish_tf: true                  # 发布 odom → base_footprint
publish_acceleration: false
transform_time_offset: 0.0
transform_timeout: 0.0

# --- 是否输出协方差 -------------------------------------------------------
print_diagnostics: true
debug: false
permit_corrected_publication: false

# ============================================================================
#  传感器 0：轮式里程计
# ============================================================================
#  配置向量共 15 位，顺序为：
#    x, y, z, roll, pitch, yaw,
#    vx, vy, vz, vroll, vpitch, vyaw,
#    ax, ay, az
#  true = 使用该测量量，false = 忽略
#
#  取 [x, y, yaw, vx, vyaw] 的理由：
#    · x, y      —— 里程计给出的位置（EKF 主要靠它）
#    · yaw       —— 里程计的朝向
#    · vx        —— 前进速度
#    · vyaw      —— 角速度
#  刻意**不用** vy（横向速度）：全向底盘的横向速度测量在有打滑时噪声很大，
#  放进来反而会污染融合结果。若你的底盘横向精度确实好，可把 vy 改成 true。
#
odom0: odom
odom0_config: [true,  true,  false,
               false, false, true,
               true,  false, false,
               false, false, true,
               false, false, false]
odom0_differential: false         # false = 使用绝对位置（里程计本身从 0 累积）
odom0_relative: false
odom0_queue_size: 10
# 里程计协方差（越小越信任）。轮式里程计在中短距离较可信，
# 但会打滑，所以给中等偏小的值。
odom0_pose_rejection_threshold: 5.0
odom0_twist_rejection_threshold: 1.0

# ============================================================================
#  传感器 1：IMU
# ============================================================================
#  取 [yaw, vyaw, ax, ay] 的理由：
#    · yaw    —— 姿态朝向（fdilink AHRS 内部已做融合，比陀螺积分准）
#    · vyaw   —— 角速度，转弯时提供高频信息
#    · ax, ay —— 线加速度，帮助估计速度变化
#
#  ⚠️ **绝对不要**把 IMU 的 roll/pitch 打开（除非 IMU 型号明确支持且已标定）。
#     很多低成本 IMU 的横滚/俯仰有零偏，打开后 EKF 会把车"压歪"，
#     表现为地图整体倾斜、导航高度异常。
#
imu0: imu
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              true,  true,  false]
imu0_differential: false
imu0_relative: false
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true   # 必须：去掉重力分量

# ============================================================================
#  过程噪声（协方差）
# ============================================================================
#  数值越小 = 越信任该量的模型预测。这些是经过实践验证的保守默认值，
#  一般不需要改。若发现 EKF 输出抖动大，先把 process_noise_covariance 整体放大。
# ============================================================================
