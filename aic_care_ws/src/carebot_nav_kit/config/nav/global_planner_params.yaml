# ============================================================================
#  全局规划器参数（GlobalPlanner）
# ============================================================================
#  GlobalPlanner 用 A*/Dijkstra 在全局代价地图上搜索一条从当前位置到目标的路径。
#
#  为什么选 GlobalPlanner 而不是 NavfnROS：
#    · GlobalPlanner 是 navfn 的重写版，支持 A* 且对代价地图变化的响应更好
#    · 组委会参考配置用的也是 GlobalPlanner，行为可预期
# ============================================================================

GlobalPlanner:
  # --- 算法 ---------------------------------------------------------------
  # use_dijkstra: true  = Dijkstra（绝对最优，稍慢）
  #               false = A*（启发式，更快）
  # 3m 小场地用哪个都快，Dijkstra 更保守稳妥。
  use_dijkstra: true

  # 是否使用二次近似（让路径更平滑地绕开障碍）。
  # ⚠️ 开启后路径会明显更贴近障碍物转弯，小场地容易蹭到。
  #    这里设为 false，配合膨胀层得到更保守的路径。
  use_quadratic: false

  # 是否使用网格路径（false = 梯度下降平滑）。
  # true 时路径由栅格中心构成，可能锯齿；false 更平滑。
  use_grid_path: false

  # 允许规划器穿越未知区域（false = 只走已知可通行区域）
  allow_unknown: false

  # --- 代价与容差 ---------------------------------------------------------
  # 默认容差（米），到达目标附近多大范围内算"到了"
  default_tolerance: 0.10

  # 中性代价：给"靠近障碍但可通行"的栅格加的额外代价。
  # 值越大，路径越倾向于走中间。0.6 是常用值。
  neutral_cost: 0.6

  # 代价因子：把代价地图的 0-255 值缩放到规划用的代价范围
  cost_factor: 3.0

  # --- 可视化 -------------------------------------------------------------
  publish_potential: true      # 发布势场（rviz 可看，便于调试）
  orientation_mode: 0          # 0 = 不修改终点朝向（由 move_base 处理）
  visualize_potential: false
