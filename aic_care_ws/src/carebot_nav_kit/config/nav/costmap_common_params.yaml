# ============================================================================
#  代价地图公共参数 —— 机器人外形 + 障碍物层 + 膨胀层
# ============================================================================
#  本文件被 global_costmap 和 local_costmap 共同加载。
#
#  ⚠️ 关键：这里的数值必须与 carebot_nav_kit/config/robot/base.yaml 保持一致。
#     车体尺寸改了，两处都要改。用 nav_check.py 可以自动校验是否一致。
# ============================================================================

# --- 机器人外形 -----------------------------------------------------------
# 用圆形半径（比矩形 footprint 保守，不容易卡在窄处）
robot_radius: 0.28          # 标称 0.25（50cm 直径）+ 3cm 余量

# 若要用矩形外形（能过更窄的门，但更容易蹭到），把上面注释掉、下面打开：
# footprint: [[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]

# --- 障碍物层 -------------------------------------------------------------
obstacle_layer:
  enabled: true
  combination_method: 1        # 1 = 取最大值（多层叠加时更安全）

  # 未知区域是否当障碍（false = 当自由空间）
  track_unknown_space: true

  # 传感器读数在这一范围内会把栅格标记为障碍
  obstacle_range: 3.0
  # 在这一范围内会清除障碍标记（射线追踪）
  raytrace_range: 3.5

  observation_sources: scan

  # 激光扫描源。
  # ⚠️ topic 必须是**滤波后**的 scan。laser_filters 会去掉车体自身遮挡产生的
  #    虚假近距离点；不滤波的话，机器人会把"自己"当成障碍物而原地不动。
  scan:
    {
      sensor_frame: laser_link,
      data_type: LaserScan,
      topic: /scan_filtered,
      marking: true,
      clearing: true,
      inf_is_valid: false,
      min_obstacle_height: 0.0,
      max_obstacle_height: 2.0
    }

# --- 膨胀层 ---------------------------------------------------------------
#  膨胀层在障碍物周围生成一层"代价梯度"，让规划器倾向于远离障碍。
inflation_layer:
  enabled: true

  # 膨胀半径：障碍物外围多少米内开始有代价。
  # 太大会让窄场地无路可走，太小会贴着障碍蹭。
  # 机器人半径 0.18，取 0.22 留 4cm 余量。
  # ⚠️ 必须 > robot_radius（原来 0.22 < 0.25，膨胀层等于不起作用 -> 实测蹭墙两次）
  # 但也不能太大：试过 0.45，结果**把房间内部隔断之间的通道全封死**，
  # 全局规划直接 "Failed to get a plan" -> 四个目标 0/4 ABORTED。
  # 0.32 = 半径 0.28 + 4cm 缓冲，既保证有膨胀带，又不堵路。
  # 防蹭墙主要靠 DWA 的 occdist_scale（见 dwa_local_planner_params.yaml）。
  inflation_radius: 0.32

  # 代价衰减系数：越大，代价随距离衰减越快（越"敢于"靠近障碍）。
  # 10 是室内小场地的常用值（组委会原配置也是 10）。
  cost_scaling_factor: 5.0   # 10 太陡，小场地里走廊容易被算成全堵；5 更合适

# --- 静态层 ---------------------------------------------------------------
static_layer:
  enabled: true
  # 静态地图中未知区域的代价（-1 = 保持未知）
  unknown_cost_value: -1
