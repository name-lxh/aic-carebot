# ============================================================================
#  AMCL 定位参数 —— 针对 3m×3m 小场地优化
# ============================================================================
#  与组委会参考配置的差异及原因：
#
#   | 参数 | 组委会值 | 本配置 | 原因 |
#   |---|---|---|---|
#   | odom_model_type | diff（amcl_params.yaml）| **omni** | 底盘是全向三轮，用 diff 会持续漂移 |
#   | laser_model_type | 重复设置了两次 | likelihood_field | 原文件里 likelihood_field 被 beam 覆盖，属 bug |
#   | laser_max_beams | 60 / 300 | 90 | 小场地不需要那么多束，省算力 |
#   | min_particles | 500 | 800 | 小场地特征少，粒子多些抗跟丢 |
#   | update_min_d | 0.25 | 0.10 | 小场地移动距离短，更新要更勤 |
#   | update_min_a | 0.2 | 0.10 | 同上 |
#   | laser_z_hit | 0.5 | 0.9 | 提高命中权重，室内结构化环境更准 |
#
#  ⚠️ 组委会 amcl_params.yaml 里有个拼写错误：`aser_z_short`（应为 `laser_z_short`），
#     导致该行被静默忽略。本文件已修正。
# ============================================================================

# --- 坐标系 ---------------------------------------------------------------
odom_frame_id: odom
base_frame_id: base_footprint
global_frame_id: map

# --- 运动模型 -------------------------------------------------------------
# omni  三轮/四轮全向（组委会 carebot 平台）
# diff  两轮差速
# ⚠️ 这是最容易配错的一项。用错模型的表现：侧向平移时定位持续漂移。
odom_model_type: omni

# 这个参数控制"使用地图话题还是服务获取地图"
use_map_topic: true

# --- 粒子数 ---------------------------------------------------------------
min_particles: 800
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

# --- 里程计噪声 -----------------------------------------------------------
odom_alpha1: 0.2      # 旋转分量中的旋转噪声
odom_alpha2: 0.2      # 旋转分量中的平移噪声
odom_alpha3: 0.2      # 平移分量中的平移噪声
odom_alpha4: 0.2      # 平移分量中的旋转噪声
odom_alpha5: 0.1      # 仅全向模型使用（横向）

# --- 激光模型 -------------------------------------------------------------
# likelihood_field 比 beam 更鲁棒（对动态障碍物和噪声不敏感），室内首选。
# ⚠️ 组委会配置文件里这一项被写了两遍，后一个 beam 覆盖了前一个，是个 bug。
laser_model_type: likelihood_field

laser_max_beams: 90
laser_min_range: 0.10
laser_max_range: 10.0
laser_likelihood_max_dist: 2.0

laser_z_hit: 0.9
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1

# --- 更新阈值 -------------------------------------------------------------
# 小场地里机器人移动距离短，阈值要小，否则定位更新太稀疏
update_min_d: 0.10    # m
update_min_a: 0.10    # rad

# --- 重采样 ---------------------------------------------------------------
resample_interval: 1
recovery_alpha_slow: 0.001    # 慢速恢复（全局重定位）
recovery_alpha_fast: 0.1      # 快速恢复

# --- 其他 -----------------------------------------------------------------
transform_tolerance: 1.0      # 容忍 TF 延迟（树莓派/迷你主机负载高时可调大）
gui_publish_rate: 5.0         # 粒子云发布频率（rviz 显示用，调低省算力）

