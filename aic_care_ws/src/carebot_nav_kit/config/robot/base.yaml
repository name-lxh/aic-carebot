# ============================================================================
#  机器人本体参数 —— 硬件无关的抽象层
# ============================================================================
#  本文件描述"机器人是什么样"，不描述"接在哪个串口"。
#  所有坐标变换、代价地图尺寸、规划器限速都从这里派生，
#  这样换硬件时只需要改 base.yaml（几何）和 hw_profile（设备），互不干扰。
#
#  实测来源：组委会 carebot 平台
#    · URDF 碰撞体半径 0.178 m
#    · base_footprint → base_link  z = +0.06
#    · base_link → laser           z = +0.21
#    · base_link → IMU             z = +0.11, x = +0.125
# ============================================================================

robot:
  # --- 坐标系 -------------------------------------------------------------
  frames:
    map: map
    odom: odom
    base_footprint: base_footprint     # 贴地投影点，导航栈的基准
    base_link: base_link               # 车体中心
    laser: laser_link
    imu: IMU_link
    camera: camera_link

  # --- 几何尺寸 -----------------------------------------------------------
  geometry:
    # 碰撞体半径（costmap inflation 的基准）
    # 实测 0.178，取 0.18 留 2mm 余量
    radius: 0.18

    # 是否用矩形 footprint 代替圆形 radius
    # 圆形更保守、更不容易卡；矩形能过更窄的门。
    # 3m×3m 小场地建议用圆形（默认）。
    use_footprint: false
    footprint: "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"

    # 车体高度（仅用于可视化与信息展示，不参与规划）
    height: 0.33

  # --- 运动学 -------------------------------------------------------------
  kinematics:
    # 底盘类型：
    #   omni  三轮/四轮全向（组委会 carebot 平台）
    #   diff  两轮差速
    #   ackermann 阿克曼
    type: omni

    # 是否启用全向平移（横移）。
    # omni 底盘开启后能在窄场地大幅减少掉头，强烈建议开启。
    holonomic: true

    # 最大速度（必须满足赛题规则下限：线速度 ≥0.6 m/s，角速度 ≥4 rad/s）
    max_vel_x: 0.8          # 规则要求 ≥0.6
    max_vel_theta: 4.0      # 规则要求 ≥4
    max_vel_y: 0.4          # 仅全向底盘有效

    # 加速度限制（保守值，避免打滑导致里程计漂移）
    acc_lim_x: 1.0
    acc_lim_y: 1.0
    acc_lim_theta: 3.0

    # 实际比赛时的速度缩放（0~1）。规则要求的是"平台能力"，实际跑用较低速度更稳。
    # 通过 ROS 参数动态下发，不改上面的能力上限。
    competition_speed_scale: 0.6

  # --- 传感器安装位姿（静态 TF）-------------------------------------------
  # 这些值必须与实车一致，否则建图会扭曲、导航会偏。
  # 用 scripts/check_hardware.sh 可校核。
  sensor_mounts:
    laser:
      parent: base_link
      # 组委会 car_nav.launch 实测值
      xyz: [0.0, 0.0, 0.21]
      rpy: [0.0, 0.0, 0.0]
    imu:
      parent: base_link
      xyz: [0.125, 0.0, 0.11]
      rpy: [0.0, 0.0, 0.0]
    camera:
      parent: base_link
      xyz: [0.10, 0.0, 0.11]
      rpy: [0.0, 0.0, 0.0]
    base_link:
      parent: base_footprint
      xyz: [0.0, 0.0, 0.06]
      rpy: [0.0, 0.0, 0.0]

# ============================================================================
#  里程计来源
# ============================================================================
#  同一个机器人可能用不同的里程计链路，这里显式声明，避免话题错配。
#
#  可选值：
#    raw      直接使用底盘发布的 /odom
#    ekf_rl   使用 robot_localization 的 EKF 输出 /odometry/filtered
#    ekf_rpe  使用 robot_pose_ekf 的输出 /robot_pose_ekf/odom_combined
# ============================================================================
odometry:
  source: ekf_rl
  topics:
    raw: /odom
    ekf_rl: /odometry/filtered
    ekf_rpe: /robot_pose_ekf/odom_combined

# ============================================================================
#  速度标定系数
# ============================================================================
#  底盘实际走的距离/角度与指令值的比值。
#  用 scripts/calibrate_linear.py 和 calibrate_angular.py 实测后填入。
#  组委会参考值：linear_scale_correction = 0.960379
# ============================================================================
calibration:
  linear_scale: 1.0        # 实际距离 / 指令距离
  angular_scale: 1.0       # 实际角度 / 指令角度
  # 标定时的目标量
  test_distance: 2.0       # m
  test_angle_deg: 360.0    # 转一圈
  tolerance_linear: 0.01   # m
  tolerance_angular: 0.02  # rad
