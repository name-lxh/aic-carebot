# ============================================================================
#  gmapping SLAM 参数 —— 针对 3m×3m 居家场地优化
# ============================================================================
#  与组委会参考配置的差异及原因（参考值见 carebot_navigation/gmapping_slam.launch）：
#
#   | 参数 | 组委会值 | 本配置 | 原因 |
#   |---|---|---|---|
#   | particles | 30 | 50 | 小场地特征少，粒子多些更不容易跟丢 |
#   | linearUpdate | 0.3 | 0.15 | 建图时走慢一点，地图更细 |
#   | angularUpdate | 0.4 | 0.2 | 同上，转向时多扫几帧 |
#   | delta | 0.05 | 0.025 | 分辨率翻倍，3m 场地用得上 |
#   | maxUrange | 8.0 | 8.0 | 与组委会一致；A1M8 量程 12m，8m 内信噪比可接受 |
#   | maxRange | 8.0 | 10.0 | 略放大，配合 A1M8 的 12m 量程 |
#   | minimumScore | 50 | 30 | 放宽匹配阈值，避免特征少时丢定位 |
#   | temporalUpdate | 3.0 | 2.0 | 静止时也周期性更新，防止地图停滞 |
#
#  ⚠️ delta（分辨率）与内存是权衡：0.025 会让地图文件变大，
#     但 3m×3m 场地总像素量很小（约 120×120），完全无所谓。
#
#  ⚠️ 雷达型号待现场确认：指导书报的是镭神 LSLIDAR M10，
#     但实际手上的雷达是 RPLIDAR A1M8。两者角度增量不同
#     （A1M8 是 0.5°/点），上实车后用 nav_check.py 核实后再微调。
# ============================================================================

# --- 坐标系（必须与 base.yaml 一致）---------------------------------------
base_frame: base_footprint
odom_frame: odom
map_frame: map

# --- 更新频率 -------------------------------------------------------------
map_update_interval: 2.0      # 地图发布间隔（秒）
temporalUpdate: 2.0           # 无运动时也按此周期更新
linearUpdate: 0.15            # 移动超过此距离（m）才做一次扫描匹配
angularUpdate: 0.2            # 转动超过此角度（rad）才做一次扫描匹配

# --- 激光模型 -------------------------------------------------------------
maxUrange: 8.0                # 扫描匹配使用的最大距离（比雷达量程小，滤掉远端噪声）
maxRange: 10.0                # 地图中该距离之外标为未知
sigma: 0.05                   # 扫描匹配标准差
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0                      # 0 = 使用全部激光点

minimumScore: 30              # 扫描匹配最低得分（放宽，小场地特征少）

# --- 运动模型噪声（里程计可靠性）------------------------------------------
# srr/srt/str/stt 越大表示越不信任里程计。
# 我们的底盘有 EKF 融合，里程计较可信，所以用偏小值。
srr: 0.1    # 平移 -> 平移
srt: 0.2    # 平移 -> 旋转
str: 0.1    # 旋转 -> 平移
stt: 0.2    # 旋转 -> 旋转

# --- 粒子数 ---------------------------------------------------------------
particles: 50
resampleThreshold: 0.5

# --- 地图范围 -------------------------------------------------------------
# 3m×3m 场地，留足余量到 ±4m
xmin: -4.0
ymin: -4.0
xmax: 4.0
ymax: 4.0
delta: 0.025                  # 分辨率 2.5cm

# --- 扫描匹配采样 ---------------------------------------------------------
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005

# --- 建图时不发布 TF（由 EKF 发布 odom→base_footprint）--------------------
# gmapping 只发布 map→odom。
# 注意：这个参数在 launch 里以 tf 相关形式设置，不在此处。

