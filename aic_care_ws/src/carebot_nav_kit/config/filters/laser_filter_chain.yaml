# ============================================================================
#  激光滤波链配置
# ============================================================================
#  被 launch/include/laser_filter.launch 加载，作用是把 /scan 变成 /scan_filtered。
#
#  按顺序执行，前一个的输出是后一个的输入：
#    1. LaserScanRangeFilter   距离截断（去车体、去远端噪声）
#    2. LaserScanSpeckleFilter 斑点过滤（去孤立噪点）
#
#  ⚠️ 各过滤器的 upper_threshold / lower_threshold 语义容易搞混，
#     下面每个都注明了实际行为。
# ============================================================================

scan_filter_chain:
  # --------------------------------------------------------------------------
  #  1. 距离截断
  # --------------------------------------------------------------------------
  #  lower_threshold: 小于此距离的点 -> 置为 NaN（即"无回波"）
  #  upper_threshold: 大于此距离的点 -> 置为 NaN
  #  use_message_range_limits: 是否也遵守消息自带的 range_min/range_max
  #
  #  ⚠️⚠️ lower_threshold 必须大于"雷达能看到的最远车体半径"，
  #         **不能只按 costmap 的 robot_radius 来定**。
  #
  #  实测踩过（这个 bug 让导航**完全跑不起来**，而且症状极误导）：
  #
  #     原来写 0.22（注释说"车体半径 0.18 + 4cm 余量"），
  #     但**雷达装在车体前方 8 cm**，所以雷达到车体外壳的最近距离
  #     不是 0.18，而是 **0.225 左右 —— 刚好卡在阈值之上，滤不掉**。
  #
  #     后果链条：
  #       1. 每帧有 130 个点（占 13%）落在 0.225~0.40 m
  #       2. costmap 的 obstacle_range=3.0 → 全部标成障碍
  #       3. **机器人周围被标出一圈致命障碍**
  #          （实测周围 ±1m 内有 63 个致命格、202 个梯度格）
  #       4. DWA 认为机器人贴着障碍 →
  #              Rotate recovery can't rotate in place
  #              because there is a potential collision. Cost: -1.00
  #          全局规划也失败 → 任务一个点都走不到
  #
  #     症状为什么误导：日志只喊 "NO PATH" / "Cost: -1.00"，
  #     **完全不提激光**；而 /scan 里的 0.225 看着像正常读数。
  #
  #     真正的判据：**机器人处于空旷处时，scan 的最小值应该等于
  #     "雷达到最远车体点"的距离**，而不是某个接近 0.2 的值。
  #
  #  ---- 取值必须按**几何关系**算，不能凭感觉 ----
  #
  #  雷达装在车体**前方 8 cm**（见 fake_sensors 的 laser_offset，
  #  实车也是类似布置），所以"雷达到车体外壳"的距离**随角度变化**：
  #
  #      朝车头方向（雷达正前方）:  0.18 - 0.08 = 0.10 m   ← 最近
  #      朝车尾方向（雷达正后方）:  0.18 + 0.08 = 0.26 m   ← 最远
  #      朝左右两侧:                0.18 m
  #
  #  ⚠️ 阈值必须大于**最远的那个**（0.26），否则车尾方向的自身回波滤不掉。
  #
  #  实测数据（本项目）：/scan 里 <0.40m 的点有 130 个，
  #  最小值 0.225，对应角度 95~99 度（即雷达右侧略偏后）。
  #  这正好落在"0.18~0.26"的预期区间内 —— **是自扫，不是环境**。
  #
  #  修前 0.22 → 滤不掉 → 机器人周围一圈假障碍 →
  #      DWA: Rotate recovery can't rotate in place. Cost: -1.00
  #      全局规划: aborted（路径被阻塞或无法规划）
  #  修到 0.30 后：local_costmap 机器人处代价 85 → 0，
  #      但**仍有零星 aborted** —— 因为 0.30 只盖住了 0.225 那批，
  #      车尾方向 0.26 附近的点还在边缘。
  #
  #  现取 **0.38**：0.26 + 0.12 余量。
  #
  #  ---- ⚠️⚠️ 实车必须现场重新标定，不要照抄 ----
  #  上面的 0.08 / 0.18 是**仿真车型**的几何。
  #  实车的雷达前伸量和车体外形都不一样。
  #
  #  标定方法（把机器人放**空旷处**，周围 2 m 内无物）：
  #      rostopic echo -n1 /scan/ranges | tr ',' '\n' | sort -n | head -20
  #  最小的那几个数就是"扫到自己"的距离；取
  #      **实测最小值 + 0.08**（余量）
  #  作为阈值。
  #
  #  ⚠️ 也不能一味加大：太大会把真实近距离障碍滤掉导致撞墙。
  #     上限参考：车体最大半径 + 0.15 m。
  #     本项目：0.26 + 0.15 = 0.41，所以 0.38 尚在安全范围内。
  # --------------------------------------------------------------------------
  - name: range
    type: laser_filters/LaserScanRangeFilter
    params:
      use_message_range_limits: false
      # ⚠️⚠️ 0.38 -> 0.50：实测这台车的**车体自遮挡一直延伸到 ~0.52 m**
      #   （扫描到的近距回波是 0.42 / 0.47 / 0.50 / 0.52 / 0.65 这样一串
      #    连续值，分布在几乎全部 360°，不是墙——50 cm 车径 + 雷达支架走不到那么远）
      #
      #   原来 0.38 只滤掉一部分，剩下的 0.42~0.52 被
      #   costmap_common 的 obstacle_layer 当成障碍，**在机器人周围围了一圈**，
      #   DWA 于是找不到不碰撞的轨迹，只能以 0.006 m/s 龟速爬
      #   （实测 90 s 只走了 0.55 m，日志 7.9 万行）。
      #
      #   提到 0.50 后这些幽灵障碍全部消失；
      #   代价是 0.50 m 以内的真墙看不见——但 robot_radius=0.25，
      #   机器人本来也不该走到离墙 0.5 m 以内。
      lower_threshold: 0.50      # 车体自遮挡实测到 ~0.52，取 0.50
      upper_threshold: 8.0       # 室内 8m 外基本是噪声/反光
      lower_replacement_value: .nan
      upper_replacement_value: .nan

  # --------------------------------------------------------------------------
  #  2. 斑点（散粒）过滤
  # --------------------------------------------------------------------------
  #  原理：对每个点，统计其在 radius 邻域内的邻居数量。
  #        邻居数少于 neighbors 的点被视为孤立噪点，置为 NaN。
  #
  #  neighbors: 最少邻居数。2 比较保守（只去真正的孤立点）；
  #             3~5 更激进，玻璃/镜面反射造成的成片假点也能去掉。
  #  radius:    邻域半径（米）。用 0.05（= 地图分辨率的量级）比较合适。
  #
  #  ⚠️ 过滤太激进会把真实的小物体（桌腿、椅腿）也去掉，
  #     导致机器人撞上去。宁可保守一点。
  # --------------------------------------------------------------------------
  - name: speckle
    type: laser_filters/LaserScanSpeckleFilter
    params:
      filter_type: 0             # 0 = 距离邻域；1 = 只比较相邻点
      max_range: 8.0
      max_range_difference: 0.1
      filter_window: 2           # 邻居数阈值
