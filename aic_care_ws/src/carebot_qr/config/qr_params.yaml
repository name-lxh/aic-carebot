# 二维码识别参数 — 智慧养老护理赛题
# 现场调参建议：光线暗时提高 enable_clahe 与 upscale；识别慢时降低 max_attempts。

# --- 数据源 ---------------------------------------------------------------
image_topic: /camera/rgb/image_raw
depth_topic: /camera/depth/image_raw
use_depth: true            # 融合深度估算二维码距离

# --- 预处理 ---------------------------------------------------------------
roi_top_ratio: 0.35        # 只处理图像下半部（二维码通常贴在低处/地面附近）
enable_clahe: true         # 自适应直方图均衡化，抗阴影/反光
upscale: 2.0               # 远距离小码二次检测的上采样倍数

# --- 去抖与超时 -----------------------------------------------------------
confirm_frames: 3          # 同一载荷连续 N 帧一致才接受（防单帧误读）
max_attempts: 30           # 单次识别的最大帧尝试数（与 /qr/detect_once 的 15s 配合）

# --- 输出 -----------------------------------------------------------------
publish_debug: true        # 发布 /qr/debug_image（2 号机位演示用）

# --- 可选补光 -------------------------------------------------------------
# 若外接补光（GPIO/继电器/智能灯），把其控制话题填这里，识别前会发 'on'
light_trigger_topic: ''
